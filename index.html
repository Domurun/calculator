
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="calculator">
        <h1>Calculator</h1>

        <div
            id="display"
            class="display"
            role="status"
            aria-live="polite"
            aria-label="Calculator display"
        >0</div>

        <div class="buttons">
            <button data-action="clear" class="utility">Clear</button>
            <button data-action="backspace" class="utility">⌫</button>
            <button data-operator="/" class="operator">÷</button>
            <button data-operator="*" class="operator">×</button>

            <button data-digit="7">7</button>
            <button data-digit="8">8</button>
            <button data-digit="9">9</button>
            <button data-operator="-" class="operator">−</button>

            <button data-digit="4">4</button>
            <button data-digit="5">5</button>
            <button data-digit="6">6</button>
            <button data-operator="+" class="operator">+</button>

            <button data-digit="1">1</button>
            <button data-digit="2">2</button>
            <button data-digit="3">3</button>
            <button data-action="equals" class="equals">=</button>

            <button data-digit="0" class="zero">0</button>
            <button data-action="decimal">.</button>
        </div>

        <p class="hint">You can also use your keyboard.</p>
    </main>
</body>
</html>
